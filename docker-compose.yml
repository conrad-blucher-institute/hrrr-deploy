services:
  wgrib2:
    image: sondngyn/wgrib2:aws
    container_name: hrrr-extractor
    env_file: ./.env
    entrypoint: /bin/bash
    environment:
      # Container paths (do not change these)
      - HRRR_BASE_PATH=/srv
      - HRRR_DOWNLOAD_PATH=/srv/download
      - HRRR_ARCHIVE_PATH=/srv/archive
      - HRRR_LOG_PATH=/srv/logs
      - HRRR_OUTPUT_PATH=/srv/output
      # Processing options
      - ENABLE_CHECKPOINT=${ENABLE_CHECKPOINT:-true}
    # Default command - runs the HRRR extraction script
    command: ${RUN_COMMAND:-/opt/aws-process-hrrr.sh}
    volumes:
      # Mount scripts directory (read-only)
      - type: bind
        source: ${HOST_SCRIPT_ABS_DIR}
        target: /opt/
        read_only: true
      # Mount data directory (read-write)
      - type: bind
        source: ${HOST_DATA_ABS_DIR}
        target: /srv/
    restart: "always"
    # Run as non-root user (matches host user for file permissions)
    user: "${DOCKER_USER_ID:-1000}:${DOCKER_GROUP_ID:-1000}"
    # Resource limits to prevent high CPU usage
    cpus: 2.0
    mem_limit: 4g
